<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metafyx AI</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 360px;
      min-height: 300px;
      padding: 1.5rem;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }

    h1 {
      font-size: 1.4rem;
      margin-top: 0;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 600;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #999;
      margin-bottom: 1.5rem;
    }

    .status-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(102, 126, 234, 0.3);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }

    .status-item {
      display: flex;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    .status-item:last-child {
      margin-bottom: 0;
    }

    .status-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      margin-right: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .status-icon.success {
      background: #4ade80;
      color: white;
    }

    .status-icon.error {
      background: #f87171;
      color: white;
    }

    .status-icon.loading {
      background: #fbbf24;
      color: white;
      animation: spin 2s linear infinite;
    }

    .status-icon.pending {
      background: #60a5fa;
      color: white;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .status-label {
      flex: 1;
    }

    .status-value {
      color: #667eea;
      font-weight: 600;
    }

    .button-container {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    button {
      flex: 1;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-message {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: #fca5a5;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .info-text {
      font-size: 0.8rem;
      color: #999;
      line-height: 1.5;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .info-text strong {
      color: #667eea;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin: 0.75rem 0;
      display: none;
    }

    .progress-bar.show {
      display: block;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <h1>🚀 Metafyx AI</h1>
  <p class="subtitle">AI-powered metadata for Adobe Stock</p>

  <div class="error-message" id="errorMessage"></div>

  <div class="status-box">
    <div class="status-item">
      <div class="status-icon pending" id="pageStatus">✓</div>
      <div class="status-label">Page Status</div>
      <div class="status-value" id="pageStatusValue">Checking...</div>
    </div>
    <div class="status-item">
      <div class="status-icon pending" id="backendStatus">✓</div>
      <div class="status-label">Backend Server</div>
      <div class="status-value" id="backendStatusValue">Checking...</div>
    </div>
    <div class="status-item">
      <div class="status-icon pending" id="processingStatus">✓</div>
      <div class="status-label">Processing</div>
      <div class="status-value" id="processingValue">Ready</div>
    </div>
  </div>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="button-container">
    <button class="btn-primary" id="startBtn">START</button>
    <button class="btn-secondary" id="stopBtn">STOP</button>
  </div>

  <div class="info-text">
    <strong>Instructions:</strong>
    <br>1. Navigate to Adobe Stock upload page
    <br>2. Click <strong>START</strong> to begin
    <br>3. AI will analyze images and fill metadata
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
