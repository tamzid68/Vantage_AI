<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metafyx AI</title>
  <style>
    body {
      width: 300px;
      padding: 1rem;
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h1 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #b0b0b0;
    }
    .status {
      margin-top: 1rem;
      padding: 0.75rem;
      background: #252525;
      border-radius: 6px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>Metafyx AI</h1>
  <p>Navigate to Adobe Stock's New Uploads page to use the extension.</p>
  <div class="status">

  </div>

</html>
