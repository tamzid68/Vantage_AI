version: '3.8'

services:
  metafyx-backend:
    build: .
    container_name: metafyx-ai-backend
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      API_KEY: ${API_KEY}
      PORT: 3000
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - metafyx-network

networks:
  metafyx-network:
    driver: bridge
