version: '3.8'

services:
  metafyx-backend:
    build: .
    container_name: metafyx-ai-backend
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      # Keys are optional: users can enter their own in the extension popup
      API_KEY: ${API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GROK_MODEL: ${GROK_MODEL:-}
      PORT: 3000
      HOST: 0.0.0.0
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - metafyx-network

networks:
  metafyx-network:
    driver: bridge
